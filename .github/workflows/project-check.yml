name: Project setup and declared targets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          mk_all-check: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Check the current project stage
        run: python scripts/check_project.py --repo .
      - name: Preserve this run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-check-evidence-${{ github.sha }}
          path: |
            .project-verification/
            .paper-verification/
          include-hidden-files: true
          if-no-files-found: warn
