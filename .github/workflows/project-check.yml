name: Project setup and declared targets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the full paper slice plan
        run: |
          python scripts/check_slices.py --repo .
          python scripts/test_slices.py
      - name: Prepare pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          mk_all-check: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Check the current project stage
        # This cache request is restricted to the current algebra imports.
        # Keep it in sync with new imports when further fragments are added.
        # Sources and versions are fixed by the project manifest.
        run: |
          lake exe cache get Mathlib.Data.Real.Basic Mathlib.Algebra.BigOperators.Ring.Finset Mathlib.Tactic.FieldSimp Mathlib.Tactic.Linarith Mathlib.Tactic.Ring Mathlib.Data.Complex.Basic Mathlib.Algebra.BigOperators.Fin Mathlib.Tactic.FinCases Mathlib.Tactic.NormNum Mathlib.Algebra.Order.BigOperators.Group.Finset
          python scripts/check_project.py --repo .
      - name: Preserve this run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-check-evidence-${{ github.sha }}
          path: |
            .project-verification/
            .paper-verification/
          include-hidden-files: true
          if-no-files-found: warn
