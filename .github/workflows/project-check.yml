name: Project setup and declared targets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the full paper slice plan
        run: |
          python scripts/check_slices.py --repo .
          python scripts/test_slices.py
      - name: Prepare pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          mk_all-check: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Check the current project stage
        # This cache request is restricted to the current project imports.
        # Keep it in sync with new imports when further fragments are added.
        # Sources and versions are fixed by the project manifest.
        run: |
          lake exe cache get Mathlib.Algebra.BigOperators.Fin Mathlib.Algebra.BigOperators.Ring.Finset Mathlib.Algebra.Order.BigOperators.Group.Finset Mathlib.Algebra.Order.BigOperators.Ring.Finset Mathlib.Analysis.Calculus.BumpFunction.InnerProduct Mathlib.Analysis.Calculus.BumpFunction.Normed Mathlib.Analysis.Calculus.BumpFunction.SmoothApprox Mathlib.Analysis.Calculus.ContDiff.Basic Mathlib.Analysis.Calculus.ContDiff.Defs Mathlib.Analysis.Calculus.ContDiff.Operations Mathlib.Analysis.Calculus.FDeriv.Add Mathlib.Analysis.Calculus.FDeriv.Congr Mathlib.Analysis.Calculus.FDeriv.Mul Mathlib.Analysis.Calculus.LineDeriv.IntegrationByParts Mathlib.Analysis.Calculus.VectorField Mathlib.Analysis.Distribution.FourierSchwartz Mathlib.Analysis.Distribution.SchwartzSpace Mathlib.Analysis.Fourier.FourierTransform Mathlib.Analysis.InnerProductSpace.Basic Mathlib.Analysis.InnerProductSpace.LinearMap Mathlib.Analysis.InnerProductSpace.PiL2 Mathlib.Analysis.Matrix.Order Mathlib.Analysis.Normed.Group.Bounded Mathlib.Analysis.Normed.Operator.Completeness Mathlib.Analysis.SpecialFunctions.Sqrt Mathlib.Analysis.SpecialFunctions.Trigonometric.Deriv Mathlib.Data.Complex.Basic Mathlib.Data.Real.Basic Mathlib.Geometry.Manifold.MFDeriv.Atlas Mathlib.Geometry.Manifold.VectorBundle.Riemannian Mathlib.Geometry.Manifold.VectorBundle.SmoothSection Mathlib.Geometry.Manifold.VectorBundle.Tangent Mathlib.Geometry.Manifold.VectorField.LieBracket Mathlib.LinearAlgebra.BilinearForm.Properties Mathlib.LinearAlgebra.Matrix.BilinearForm Mathlib.LinearAlgebra.Matrix.Kronecker Mathlib.LinearAlgebra.Matrix.PosDef Mathlib.LinearAlgebra.Matrix.Vec Mathlib.LinearAlgebra.Multilinear.Basis Mathlib.LinearAlgebra.Multilinear.Curry Mathlib.MeasureTheory.Function.ContinuousMapDense Mathlib.MeasureTheory.Function.Jacobian Mathlib.MeasureTheory.Function.L2Space Mathlib.MeasureTheory.Function.LpSeminorm.Basic Mathlib.MeasureTheory.Function.LpSpace.Basic Mathlib.MeasureTheory.Function.LpSpace.Indicator Mathlib.MeasureTheory.Integral.Bochner.Basic Mathlib.MeasureTheory.Integral.Bochner.Set Mathlib.MeasureTheory.Integral.DominatedConvergence Mathlib.MeasureTheory.Integral.IntegrableOn Mathlib.MeasureTheory.Integral.Prod Mathlib.MeasureTheory.Measure.Haar.InnerProductSpace Mathlib.MeasureTheory.Measure.Haar.NormedSpace Mathlib.MeasureTheory.Measure.Lebesgue.Basic Mathlib.MeasureTheory.Measure.OpenPos Mathlib.MeasureTheory.Measure.Restrict Mathlib.MeasureTheory.Measure.WithDensity Mathlib.Order.Filter.AtTopBot.Archimedean Mathlib.Tactic.FieldSimp Mathlib.Tactic.FinCases Mathlib.Tactic.Linarith Mathlib.Tactic.NoncommRing Mathlib.Tactic.NormNum Mathlib.Tactic.Ring Mathlib.Topology.Algebra.Module.Basic Mathlib.Topology.Algebra.Module.FiniteDimension Mathlib.Topology.Algebra.Module.Multilinear.Basic Mathlib.Topology.Algebra.Order.Field Mathlib.Topology.Compactness.Lindelof Mathlib.Topology.ContinuousMap.CompactlySupported Mathlib.Topology.Instances.Matrix Mathlib.Topology.Instances.Real.Lemmas Mathlib.Topology.MetricSpace.Cauchy Mathlib.Topology.MetricSpace.Pseudo.Basic Mathlib.Topology.Sequences Mathlib.Topology.UniformSpace.HeineCantor Mathlib.Topology.UniformSpace.UniformConvergence Mathlib.Topology.UrysohnsLemma Mathlib.Geometry.Manifold.BumpFunction Mathlib.LinearAlgebra.Trace Mathlib.Analysis.Matrix Mathlib.Analysis.Calculus.Deriv.Abs Mathlib.Analysis.ODE.PicardLindelof Mathlib.Topology.ContinuousMap.Bounded.ArzelaAscoli Mathlib.Analysis.Calculus.ContDiff.FiniteDimension Mathlib.Analysis.Calculus.ContDiff.WithLp Mathlib.Geometry.Manifold.LocalDiffeomorph Mathlib.Analysis.SpecialFunctions.Integrals.Basic Mathlib.MeasureTheory.Function.LocallyIntegrable Mathlib.Analysis.Calculus.BumpFunction.FiniteDimension Mathlib.Analysis.Calculus.Deriv.Prod Mathlib.Analysis.Calculus.LocalExtr.Basic Mathlib.Analysis.Normed.Module.FiniteDimension Mathlib.Analysis.ODE.Gronwall Mathlib.Analysis.SpecialFunctions.Trigonometric.ArctanDeriv Mathlib.Geometry.Manifold.PartitionOfUnity Mathlib.Geometry.Manifold.VectorBundle.Hom Mathlib.LinearAlgebra.Matrix.ToLinearEquiv Mathlib.MeasureTheory.Integral.Bochner.ContinuousLinearMap Mathlib.MeasureTheory.Measure.Regular Mathlib.Topology.MetricSpace.ProperSpace Mathlib.Analysis.Calculus.MeanValue Mathlib.Analysis.Complex.Basic Mathlib.Analysis.Distribution.AEEqOfIntegralContDiff Mathlib.MeasureTheory.Function.SpecialFunctions.Basic Mathlib.MeasureTheory.Group.Integral Mathlib.MeasureTheory.Integral.MeanInequalities Mathlib.Data.Complex.BigOperators Mathlib.Data.Matrix.Basic Mathlib.MeasureTheory.Integral.RieszMarkovKakutani.Real Mathlib.MeasureTheory.Measure.Complex Mathlib.MeasureTheory.Measure.HasOuterApproxClosed Mathlib.Topology.ContinuousMap.Star Mathlib.Probability.Kernel.Disintegration.Integral Mathlib.Probability.Kernel.Disintegration.Unique Mathlib.Probability.Kernel.WithDensity Mathlib.Probability.Kernel.CompProdEqIff Mathlib.Probability.Kernel.Composition.MeasureCompProd Mathlib.Analysis.Calculus.FDeriv.Measurable
          python scripts/check_project.py --repo .
      - name: Preserve this run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-check-evidence-${{ github.sha }}
          path: |
            .project-verification/
            .paper-verification/
          include-hidden-files: true
          if-no-files-found: warn
