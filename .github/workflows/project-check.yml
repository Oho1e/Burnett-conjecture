name: Project setup and declared targets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the full paper slice plan
        run: |
          python scripts/check_slices.py --repo .
          python scripts/test_slices.py
      - name: Prepare pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          mk_all-check: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Check the current project stage
        # This cache request is restricted to the current project imports.
        # Keep it in sync with new imports when further fragments are added.
        # Sources and versions are fixed by the project manifest.
        run: |
          lake exe cache get Mathlib.Algebra.BigOperators.Fin Mathlib.Algebra.BigOperators.Ring.Finset Mathlib.Algebra.Order.BigOperators.Group.Finset Mathlib.Analysis.Calculus.BumpFunction.InnerProduct Mathlib.Analysis.Calculus.BumpFunction.Normed Mathlib.Analysis.Calculus.ContDiff.Basic Mathlib.Analysis.Calculus.ContDiff.Operations Mathlib.Analysis.Calculus.LineDeriv.IntegrationByParts Mathlib.Analysis.InnerProductSpace.LinearMap Mathlib.Analysis.InnerProductSpace.PiL2 Mathlib.Analysis.Normed.Operator.Completeness Mathlib.Analysis.SpecialFunctions.Trigonometric.Deriv Mathlib.Data.Complex.Basic Mathlib.Data.Real.Basic Mathlib.MeasureTheory.Function.L2Space Mathlib.MeasureTheory.Function.LpSpace.Indicator Mathlib.Order.Filter.AtTopBot.Archimedean Mathlib.Tactic.FieldSimp Mathlib.Tactic.FinCases Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum Mathlib.Tactic.Ring Mathlib.Topology.Algebra.Module.Basic Mathlib.Topology.Algebra.Order.Field Mathlib.Topology.MetricSpace.Pseudo.Basic Mathlib.Algebra.Order.BigOperators.Ring.Finset Mathlib.Analysis.Distribution.FourierSchwartz Mathlib.Analysis.Fourier.FourierTransform Mathlib.LinearAlgebra.BilinearForm.Properties Mathlib.MeasureTheory.Integral.DominatedConvergence Mathlib.Topology.Instances.Real.Lemmas Mathlib.Topology.Sequences Mathlib.Analysis.Calculus.BumpFunction.SmoothApprox Mathlib.Analysis.Calculus.FDeriv.Add Mathlib.Analysis.Calculus.FDeriv.Congr Mathlib.Analysis.Distribution.SchwartzSpace Mathlib.Analysis.Matrix.Order Mathlib.MeasureTheory.Function.ContinuousMapDense Mathlib.Topology.UniformSpace.HeineCantor
          python scripts/check_project.py --repo .
      - name: Preserve this run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-check-evidence-${{ github.sha }}
          path: |
            .project-verification/
            .paper-verification/
          include-hidden-files: true
          if-no-files-found: warn
